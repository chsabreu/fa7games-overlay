<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA7GAMES Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-blue: #00d4ff;
            --neon-cyan: #00f0ff;
            --neon-dark: #0099cc;
            --dark-bg: rgba(5, 10, 20, 0.92);
            --text-primary: #ffffff;
            --text-secondary: #a0d4f0;
            --glow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
            --glow-strong: 0 0 15px rgba(0, 212, 255, 0.7), 0 0 30px rgba(0, 212, 255, 0.4), 0 0 45px rgba(0, 212, 255, 0.2);
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Página pública: cenário atrás do overlay. No OBS use ?obs=1 (fundo transparente). */
        body.preview {
            background:
                radial-gradient(ellipse 80% 55% at 50% 78%, rgba(255, 70, 20, 0.55), transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 42%, rgba(180, 0, 80, 0.45), transparent 70%),
                #070b14;
        }

        .obs-hint {
            display: none;
            position: fixed;
            left: 16px;
            bottom: 88px;
            z-index: 20;
            font-size: 12px;
            letter-spacing: 0.4px;
            color: rgba(160, 212, 240, 0.85);
            background: rgba(5, 10, 20, 0.72);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 8px;
            padding: 8px 12px;
        }

        body.preview .obs-hint {
            display: block;
        }

        /* ===== OVERLAY CONTAINER ===== */
        .overlay {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            width: 100%;
            height: 110px;
            background: linear-gradient(180deg, rgba(5, 10, 25, 0.95) 0%, rgba(5, 10, 25, 0.85) 70%, transparent 100%);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: relative;
            z-index: 10;
        }

        /* Linha neon inferior do topo */
        .top-bar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--neon-blue) 20%, var(--neon-cyan) 50%, var(--neon-blue) 80%, transparent 100%);
            box-shadow: 0 0 8px var(--neon-blue), 0 0 16px rgba(0, 212, 255, 0.4);
            animation: pulseLine 3s ease-in-out infinite;
        }

        @keyframes pulseLine {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Logo */
        .logo-topo {
            height: 70px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.4));
            transition: filter 0.3s ease;
        }

        .logo-topo:hover {
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.7));
        }

        /* Center info */
        .center-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff3344;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3344, 0 0 16px rgba(255, 51, 68, 0.5);
            animation: livePulse 1.5s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .server-url {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--neon-cyan);
            text-shadow: var(--glow);
            letter-spacing: 2px;
        }

        .port-info {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .port-number {
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            text-shadow: var(--glow);
        }

        /* Right side decoration */
        .top-decoration {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .diamond {
            width: 10px;
            height: 10px;
            background: var(--neon-blue);
            transform: rotate(45deg);
            box-shadow: 0 0 8px var(--neon-blue);
            animation: diamondGlow 2s ease-in-out infinite;
        }

        @keyframes diamondGlow {
            0%, 100% { opacity: 0.6; box-shadow: 0 0 5px var(--neon-blue); }
            50% { opacity: 1; box-shadow: 0 0 12px var(--neon-blue), 0 0 20px rgba(0, 212, 255, 0.3); }
        }

        /* ===== MIDDLE AREA (100% transparent) ===== */
        .middle-area {
            flex: 1;
            background: transparent;
            /* Sem bordas, sem nada - área livre para o jogo */
        }

        /* ===== BOTTOM BAR ===== */
        .bottom-bar {
            width: 100%;
            height: 75px;
            background: linear-gradient(0deg, rgba(5, 10, 25, 0.95) 0%, rgba(5, 10, 25, 0.85) 70%, transparent 100%);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            position: relative;
            z-index: 10;
            gap: 40px;
        }

        /* Linha neon superior do rodapé */
        .bottom-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--neon-blue) 20%, var(--neon-cyan) 50%, var(--neon-blue) 80%, transparent 100%);
            box-shadow: 0 0 8px var(--neon-blue), 0 0 16px rgba(0, 212, 255, 0.4);
            animation: pulseLine 3s ease-in-out infinite reverse;
        }

        .footer-logo {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 0 6px rgba(0, 212, 255, 0.3));
        }

        .footer-divider {
            width: 1px;
            height: 30px;
            background: linear-gradient(180deg, transparent, var(--neon-blue), transparent);
            opacity: 0.5;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .footer-link:hover {
            color: var(--neon-cyan);
            text-shadow: var(--glow);
            background: rgba(0, 212, 255, 0.08);
        }

        .footer-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            filter: drop-shadow(0 0 3px currentColor);
        }

        .link-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .link-main {
            font-size: 13px;
            font-weight: 700;
        }

        .link-sub {
            font-size: 10px;
            opacity: 0.8;
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .top-bar {
                height: 90px;
                padding: 0 15px;
            }

            .logo-topo {
                height: 50px;
            }

            .server-url {
                font-size: 14px;
            }

            .port-info {
                font-size: 12px;
            }

            .port-number {
                font-size: 16px;
            }

            .live-badge {
                font-size: 10px;
                letter-spacing: 2px;
            }

            .bottom-bar {
                height: 65px;
                padding: 0 15px;
                gap: 15px;
            }

            .footer-logo {
                height: 35px;
            }

            .footer-links {
                gap: 12px;
            }

            .footer-link {
                font-size: 10px;
                padding: 4px 8px;
                gap: 5px;
            }

            .footer-link svg {
                width: 14px;
                height: 14px;
            }

            .link-main {
                font-size: 10px;
            }

            .link-sub {
                font-size: 8px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                height: 80px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
                padding: 8px 10px;
            }

            .logo-topo {
                height: 35px;
            }

            .center-info {
                gap: 3px;
            }

            .server-url {
                font-size: 12px;
            }

            .port-info {
                font-size: 11px;
                gap: 5px;
            }

            .port-number {
                font-size: 14px;
            }

            .bottom-bar {
                height: 55px;
                gap: 10px;
            }

            .footer-logo {
                height: 28px;
            }

            .footer-links {
                gap: 8px;
            }

            .footer-link {
                font-size: 9px;
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>
